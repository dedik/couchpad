plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/** Liczba commitów w repozytorium; poza gitem 3 (pierwsza wersja z aktualizacją). */
def gitCommitCount() {
    try {
        def out = providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }.standardOutput.asText.get().trim()
        return out.toInteger()
    } catch (Exception ignored) {
        return 3
    }
}

android {
    namespace 'app.couchpad.pilot'
    compileSdk 35

    defaultConfig {
        applicationId 'app.couchpad.pilot'
        // Galaxy S5 ma Androida 6 (API 23).
        minSdk 23
        targetSdk 35
        // Numer wersji rośnie z każdym commitem — aktualizacja przez Wi-Fi (ADR 0021)
        // instaluje tylko APK o wyższym versionCode niż zainstalowany.
        versionCode gitCommitCount()
        versionName "0.3.${gitCommitCount()}"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    testOptions {
        // android.util.Log i inne wywołania frameworka w testach JVM zwracają wartości domyślne.
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2023.08.00')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    // org.json z Androida to w testach JVM tylko zaślepki — prawdziwa implementacja do parserów.
    testImplementation 'org.json:json:20231013'
}
